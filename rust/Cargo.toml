[workspace]
members = [
    "lib",
    "android",
    "ios",
    "zingomobile_utils",
    "workbench",
    "uniffi-bindgen",
]

# The mixnet proxy shim resolves in its own lockfile: nym-sdk's transitive
# graph needs `crypto-common ^0.2`, irreconcilable with this workspace's pins.
exclude = [
    "nym-proxy-ffi",
    "vendor/zcash_address",
    "vendor/zcash_primitives",
    "vendor/zcash_protocol",
    "vendor/zcash_transparent",
]
resolver = "2"

[workspace.dependencies]
# SWARM SDK with legacy unified-address decoding, canonical SWARM encoding and
# the SWARM PRODUCTION network identity: `ChainType::SwarmMainnet(SwarmMainnetGenesis)`,
# `NetworkType::SwarmMain` and `BranchId::SwarmMain`. The revision is tag
# `swarm-sdk-mainnet-1`, the head of branch `codex/mainnet-sdk-identity-20260925`
# in Swarmcoin/privacy-zingolib (the account was Swarm-Official until its
# 2026-10-04 rename), and the pin the desktop wallet's addon builds against for
# the restarted network (privacy-wallet sdk/swarm-sdk-pin.json). It is one commit
# above d9f1a5b8 and reads `LightdInfo.genesisHash`, which needs the SWARM fork of
# lightwallet-protocol patched below. The SDK carries no mainnet genesis of its
# own: the genesis travels in the chain hint. Moving this rev backwards removes SWARM
# production from the build: the chain hint `swarm-mainnet:<genesis>` stops
# resolving and every mainnet wallet becomes unopenable.
zingolib = { git = "https://github.com/Swarmcoin/privacy-zingolib", rev = "c7464d2ec40a5d619500a9ebee76ac4c39775baa", features = [
    "nym",
    "perspective",
] }
pepper-sync = { git = "https://github.com/Swarmcoin/privacy-zingolib", rev = "c7464d2ec40a5d619500a9ebee76ac4c39775baa" }
zingolib_testutils = { git = "https://github.com/Swarmcoin/privacy-zingolib", rev = "c7464d2ec40a5d619500a9ebee76ac4c39775baa" }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_keys = { version = "0.16.1", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_protocol = "0.10.0"

zingo_common_components = "0.4.0"
zip32 = "0.2.0"
uniffi = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[profile.test]
opt-level = 3
debug = 1

[patch.crates-io]
# SWARM encodings. Cargo ignores a dependency's own [patch] table, so this
# workspace has to carry the SDK's patches itself, for every crate that matches
# `NetworkType` or `BranchId` exhaustively. Four crates, not two, since the SDK
# pin moved to d9f1a5b8: `zcash_primitives` and `zcash_transparent` were added
# because each of them matches one of those enums exhaustively and so does not
# compile against the patched `zcash_protocol`. See vendor/README.md.
#
# If a `cargo update` pulls a crate version that matches either enum
# exhaustively and is not vendored here, it will fail to compile. That is the
# intended failure mode: it is how a crate that could quietly fold SWARM
# production into Zcash Mainnet announces itself. Vendor it rather than
# reaching for a wildcard arm.
zcash_address = { path = "vendor/zcash_address" }
zcash_primitives = { path = "vendor/zcash_primitives" }
zcash_protocol = { path = "vendor/zcash_protocol" }
zcash_transparent = { path = "vendor/zcash_transparent" }
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize) plus the SWARM
# field `LightdInfo.genesisHash = 19`. The rev is the SWARM fork, one commit above
# zingolabs 9bdfdc77, and must match the patch in the pinned SDK so the dependency
# graph resolves to a single lightwallet-protocol.
lightwallet-protocol = { git = "https://github.com/Swarmcoin/privacy-lightwallet-protocol-rust", rev = "c9c13e46bbea726f904f12cb18cd85e57ff46d35" }
