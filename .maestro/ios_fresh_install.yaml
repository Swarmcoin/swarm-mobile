appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "welcome.title"
    timeout: 300000
- takeScreenshot: welcome
- waitForAnimationToEnd:
    timeout: 5000
# The button is disabled while the boot-time server check runs, and a tap on a
# disabled button is silently dropped: the walk then waits for a notice that
# was never asked for. Wait for it to be pressable, not merely drawn.
- extendedWaitUntil:
    visible:
      id: "loadingapp.createnewwallet"
      enabled: true
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "loadingapp.createnewwallet"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "loadingapp.createnewwallet"
    enabled: true
    retryTapIfNoChange: true
# The notice is drawn by the same JavaScript thread that is reading settings,
# resolving the server and warming the Rust layer, so on a cold runner it can
# be slow. 30 s was the one impatient wait in a flow whose others are 300 s and
# 600 s, and it is what failed run 36291652810 on a build that was fine.
- extendedWaitUntil:
    visible:
      id: "risknotice.title"
    timeout: 180000
- assertVisible: "SWARM Mainnet is the live network.*"
- takeScreenshot: mainnet-risk-notice
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "risknotice.acknowledge"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "newseed.continue"
    timeout: 600000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "newseed.continue"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- assertVisible:
    id: "header.wallets"
- assertVisible:
    id: "header.addresses"
- takeScreenshot: home-synced
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "tab.send"
    retryTapIfNoChange: true
- takeScreenshot: send-empty-wallet
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "tab.receive"
    retryTapIfNoChange: true
- assertVisible:
    id: "receive.title"
- takeScreenshot: receive
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "wallets.active.1"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "wallets.create"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "welcome.title"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "loadingapp.createnewwallet"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "loadingapp.createnewwallet"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "newseed.continue"
    timeout: 600000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "newseed.continue"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "wallets.active.2"
    timeout: 30000
- takeScreenshot: two-wallets
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "wallets.open.1"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "wallets.active.1"
    timeout: 30000
- assertVisible:
    id: "wallets.open.2"
- takeScreenshot: first-wallet-restored
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "wallets.active.1"
    timeout: 30000
- assertVisible:
    id: "wallets.open.2"
- takeScreenshot: wallets-after-relaunch
