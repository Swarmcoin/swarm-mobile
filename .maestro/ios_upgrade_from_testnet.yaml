appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- assertVisible:
    id: "wallets.active.1"
- assertVisible:
    id: "wallets.open.2"
- takeScreenshot: upgrade-retained-wallets
- tapOn:
    id: "wallets.create"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "welcome.title"
    timeout: 60000
- assertVisible: "This wallet is on SWARM Mainnet.*"
- scrollUntilVisible:
    element:
      id: "loadingapp.createnewwallet"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "loadingapp.createnewwallet"
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "risknotice.title"
    timeout: 180000
- assertVisible: "SWARM Mainnet is the live network.*"
- takeScreenshot: upgrade-mainnet-notice
- tapOn:
    id: "risknotice.acknowledge"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "newseed.continue"
    timeout: 600000
- tapOn:
    id: "newseed.continue"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- tapOn:
    id: "tab.receive"
    retryTapIfNoChange: true
- assertVisible:
    id: "receive.title"
- takeScreenshot: upgrade-mainnet-receive
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- assertVisible:
    id: "wallets.active.3"
- tapOn:
    id: "wallets.open.1"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- takeScreenshot: upgrade-testnet-restored
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- assertVisible:
    id: "wallets.active.1"
- assertVisible:
    id: "wallets.open.2"
- tapOn:
    id: "wallets.open.3"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.welcome"
    timeout: 300000
- tapOn:
    id: "header.wallets"
    retryTapIfNoChange: true
- assertVisible:
    id: "wallets.active.3"
- assertVisible:
    id: "wallets.open.1"
- assertVisible:
    id: "wallets.open.2"
- takeScreenshot: upgrade-mainnet-reopened
