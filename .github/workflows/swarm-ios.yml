name: SWARM iOS

# SWARM Wallet iOS simulator and TestFlight pipeline.
# Apple App Review guideline 3.1.5(i) requires an organisation account for
# cryptocurrency wallets. The signed job requires Apple signing secrets.
#
# Versions below are pinned against the inventory recorded by the
# `preflight` job (run 35626872504): macos-latest is macOS 26.6.2 on
# arm64 with 3 cores / 7 GB, ships Xcode 26.0 … 26.6, and has iOS
# simulator runtimes 26.2 / 26.4 / 26.5 only — there is no iOS 26.6
# runtime, which is why Xcode is pinned to 26.5 and not to the image
# default.

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: >-
          Build a SIGNED device archive and upload to TestFlight. Requires
          an Apple Developer Program organisation account and the repository
          secrets listed in docs/SWARM-IOS.md. Leave false.
        type: boolean
        default: false
  push:
    branches: [swarm-ios, codex/mobile-mainnet-20260926]

concurrency:
  group: swarm-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned explicitly. See the header for the evidence.
  XCODE_VERSION: '26.5'
  PREFERRED_SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
  PREFERRED_SIM_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
  NODE_VERSION: '22.18.0'
  # App Store Connect refuses a build number it has already seen for the
  # same MARKETING_VERSION, so CURRENT_PROJECT_VERSION must strictly
  # increase per upload. github.run_number does exactly that and never
  # restarts; the offset keeps it clear of the 1 baked into the project
  # (and of anything a local Xcode archive would produce). Both are
  # injected on the xcodebuild command line and the project file keeps its
  # own values, so opening the project in Xcode still works.
  # First MAINNET build: 0.2.0. The bundle identifier and the App Store
  # record are unchanged - only the marketing version moves.
  MARKETING_VERSION: '0.2.0'
  BUILD_NUMBER_OFFSET: '1000'
  # Keep cargo lean on a 3-core runner.
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Inventory of the hosted runner. Cheap, always runs, and is the evidence
  # behind every version pinned in this file.
  # ---------------------------------------------------------------------
  preflight:
    name: Runner inventory
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Runner image
        run: |
          set -x
          sw_vers
          uname -m
          sysctl -n hw.ncpu hw.memsize

      - name: Xcode versions installed
        run: |
          set -x
          ls -1 /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcode-select -p

      - name: Simulator runtimes and device types
        run: |
          set -x
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i iphone || true

      - name: Toolchain versions
        run: |
          set -x
          node --version || true
          yarn --version || true
          ruby --version || true
          pod --version || true
          rustup --version || true
          rustc --version || true

  # ---------------------------------------------------------------------
  # The Rust wallet library + the Nym proxy shim, built for
  # aarch64-apple-ios (device), aarch64-apple-ios-sim and x86_64-apple-ios
  # (simulator, lipo'd into one fat slice) and packed into two
  # XCFrameworks with uniffi Swift bindings — exactly the way upstream's
  # rust/ios/build_ios.mjs does it. Upstream runs this on a self-hosted
  # 12-core Mac; here it runs on a 3-core hosted runner, so the result is
  # cached on the source hash and normally never rebuilt.
  # ---------------------------------------------------------------------
  rust-xcframework:
    name: Rust xcframework (device + simulator)
    runs-on: macos-latest
    timeout-minutes: 340
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    # Deliberately NOT overriding RUSTUP_HOME / CARGO_HOME the way
    # upstream's self-hosted runner does. A workspace-local CARGO_HOME
    # puts `cargo install`ed binaries somewhere that is not on PATH, and
    # the bindgen this build needs then cannot be found.
    steps:
      - name: Pin Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute xcframework cache key
        id: key
        run: |
          set -euo pipefail
          KEY="swarm-ios-xcframework-v1-${{ runner.os }}-xc${XCODE_VERSION}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/lib/**', 'rust/vendor/**', 'rust/uniffi-bindgen/**', 'rust/zingomobile_utils/**', 'rust/ios/build_ios.mjs', 'rust/nym-proxy-ffi/Cargo.toml', 'rust/nym-proxy-ffi/Cargo.lock', 'rust/nym-proxy-ffi/src/**', 'rust/nym-proxy-ffi/uniffi.toml') }}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "xcframework cache key: $KEY"

      - name: Restore / save xcframework
        id: xcf
        uses: actions/cache@v4
        with:
          path: |
            ios/Zingolib.xcframework
            ios/zingo.swift
            ios/ZingoNymProxyFFI.xcframework
            ios/zingo_nym_proxy_ffi.swift
          key: ${{ steps.key.outputs.key }}

      - name: Rust toolchain + iOS targets
        if: steps.xcf.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rustup default stable
          rustup update stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustc --version
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      # After the toolchain step on purpose: rust-cache reads `rustc -vV`
      # into its key and RUSTUP_HOME is workspace-relative here, so it has
      # no default toolchain until the step above installs one. Two
      # workspaces: the Nym shim is excluded from the main one and has its
      # own lockfile, so its target dir needs listing separately.
      # Registry and git checkouts only — NOT the cross-compiled target
      # directories.
      #
      # A repository gets 10 GB of Actions cache shared by both agents. With
      # target dirs included this one alone was 5.59 GB of an 8.35 GB total,
      # i.e. the iOS pipeline was squeezing the Android one out. It buys
      # little: the 0.35 GB xcframework cache above already skips the whole
      # hour whenever rust/ is unchanged, which is the common case, and it
      # is small enough to survive eviction. Caching target dirs only helps
      # the rarer case where rust/ HAS changed — and then it cost 5 GB of
      # shared budget to save part of a build we pay anyway.
      - name: Cargo cache (registry and git checkouts)
        if: steps.xcf.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/nym-proxy-ffi
          cache-targets: false
          cache-on-failure: true

      - name: Install protoc
        if: steps.xcf.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install protobuf

      - name: Install bindgen-cli (needed by aws-lc-sys, ring etc.)
        if: steps.xcf.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          command -v bindgen >/dev/null || cargo install --locked bindgen-cli
          bindgen --version

      # bindgen 0.69 (pulled in transitively) does not pass an iOS
      # simulator sysroot by itself; upstream works around it the same way.
      - name: Cargo env for the iOS simulator target
        if: steps.xcf.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cargo
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          {
            echo '[env]'
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim = \"--target=arm64-apple-ios-simulator -isysroot $SDKROOT\""
            echo "CFLAGS_aarch64_apple_ios_sim = \"--target=arm64-apple-ios-simulator -isysroot $SDKROOT\""
            echo "CXXFLAGS_aarch64_apple_ios_sim = \"--target=arm64-apple-ios-simulator -isysroot $SDKROOT\""
          } > .cargo/config.toml
          cat .cargo/config.toml

      - name: Setup Node.js
        if: steps.xcf.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify SWARM address compatibility
        if: steps.xcf.outputs.cache-hit != 'true'
        working-directory: rust
        run: |
          cargo test --locked -p zingo swarm_prefix_tests --lib
          cargo test --locked -p zingo pause_idle_wallet --lib -- --test-threads=1

      - name: Build the iOS xcframeworks (upstream script, unmodified)
        if: steps.xcf.outputs.cache-hit != 'true'
        run: node rust/ios/build_ios.mjs

      - name: Show what was produced
        run: |
          set -euxo pipefail
          ls -la ios/Zingolib.xcframework ios/ZingoNymProxyFFI.xcframework
          lipo -info ios/Zingolib.xcframework/*/libzingo.a
          lipo -info ios/ZingoNymProxyFFI.xcframework/*/libzingo_nym_proxy_ffi.a
          du -sh ios/Zingolib.xcframework ios/ZingoNymProxyFFI.xcframework

      # The cache above is a build-SKIP optimisation and nothing more. The
      # handoff to the next job goes through this artifact, which is
      # run-scoped and cannot be evicted underneath us.
      #
      # Why: a repository gets 10 GB of Actions cache, shared by every
      # branch and every agent working in it. On 2026-09-21 the Android
      # workflow saved three ~2.2 GB per-ABI caches at 18:14–18:15 UTC and
      # GitHub evicted this job's xcframework cache least-recently-used.
      # With `fail-on-cache-miss` on the consumer, an eviction landing in
      # the gap between these two jobs would fail a build that had just
      # spent an hour succeeding.
      - name: Upload the xcframework for the next job
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-xcframework
          path: |
            ios/Zingolib.xcframework
            ios/zingo.swift
            ios/ZingoNymProxyFFI.xcframework
            ios/zingo_nym_proxy_ffi.swift
          retention-days: 3
          compression-level: 6

  # ---------------------------------------------------------------------
  # The app itself: pods, an unsigned Release build for the iOS Simulator,
  # then boot a simulator, install the .app, launch it and photograph it.
  # ---------------------------------------------------------------------
  app-simulator:
    name: Simulator build, launch and screenshot
    needs: rust-xcframework
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Pin Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: First launch
        run: xcodebuild -runFirstLaunch || true

      - name: Checkout
        uses: actions/checkout@v4

      # From the artifact, not the cache: see the note in rust-xcframework.
      - name: Download the xcframework
        uses: actions/download-artifact@v4
        with:
          name: swarm-ios-xcframework
          path: ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Check the store submission files
        run: node scripts/store/check_store_art.mjs --store ios

      - name: Yarn install
        run: yarn install --frozen-lockfile

      # The app icon and the launch mark are rendered here, from the SVG
      # committed at ios/branding/swarm-appicon.svg. No PNG of the SWARM
      # mark is stored in the repository and no icon website is involved.
      - name: Install librsvg (SVG renderer)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install librsvg

      - name: Render the app icon and launch mark from SVG
        run: |
          set -euxo pipefail
          bash ios/scripts/generate-ios-art.sh
          ls -la ios/Zingo/Images.xcassets/AppIcon-Prod.appiconset/
          sips -g pixelWidth -g pixelHeight -g hasAlpha \
            ios/Zingo/Images.xcassets/AppIcon-Prod.appiconset/Icon-1024.png

      - name: Upload the rendered icon set
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-appicon
          path: |
            ios/branding/*.svg
            ios/Zingo/Images.xcassets/AppIcon-Prod.appiconset/*.png
            ios/Zingo/Images.xcassets/LaunchMark.imageset/*.png
          retention-days: 30

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/vendor/hermes-dsyms
            ~/Library/Caches/CocoaPods
          key: swarm-ios-pods-v1-${{ hashFiles('ios/Podfile', 'yarn.lock', 'package.json') }}
          restore-keys: |
            swarm-ios-pods-v1-

      - name: Pod install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd ios && pod install

      # Derived once, then used by the build, the assertions and the
      # summary, so the three can never disagree.
      - name: Derive the build number
        id: version
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))
          if [ "$BUILD_NUMBER" -le 1 ]; then
            echo "::error::derived build number $BUILD_NUMBER is not greater than 1"
            exit 1
          fi
          echo "marketing version: $MARKETING_VERSION"
          echo "build number:      $BUILD_NUMBER  (run_number ${{ github.run_number }} + offset $BUILD_NUMBER_OFFSET)"
          {
            echo "build=$BUILD_NUMBER"
            echo "marketing=$MARKETING_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Create and boot the simulator
        id: sim
        run: |
          set -euo pipefail

          avail_runtimes=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.isAvailable == true) | select(.identifier | contains("SimRuntime.iOS-")) | .identifier] | join("\n")')
          echo "available iOS runtimes:"; echo "$avail_runtimes"

          RT=""
          for r in $avail_runtimes; do
            if [ "$r" = "$PREFERRED_SIM_RUNTIME" ]; then RT="$r"; fi
          done
          if [ -z "$RT" ]; then
            RT=$(echo "$avail_runtimes" | sort -V | tail -1)
            echo "::warning::preferred runtime $PREFERRED_SIM_RUNTIME not present, falling back to $RT"
          fi

          avail_types=$(xcrun simctl list devicetypes -j \
            | jq -r '[.devicetypes[] | select(.identifier | contains("SimDeviceType.iPhone")) | .identifier] | join("\n")')
          DT=""
          for d in $avail_types; do
            if [ "$d" = "$PREFERRED_SIM_DEVICE_TYPE" ]; then DT="$d"; fi
          done
          if [ -z "$DT" ]; then
            # `| head -1` would be a pipefail hazard here: head exits after
            # one line and the writer dies of SIGPIPE. Take the first word
            # instead.
            DT=$(echo "$avail_types" | sed -n '1p')
            echo "::warning::preferred device type $PREFERRED_SIM_DEVICE_TYPE not present, falling back to $DT"
          fi

          echo "runtime=$RT"
          echo "device type=$DT"

          UDID=$(xcrun simctl create "swarm-ci" "$DT" "$RT")
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override \
            --time "09:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiMode active --wifiBars 3 || true

          {
            echo "udid=$UDID"
            echo "runtime=$RT"
            echo "devicetype=$DT"
          } >> "$GITHUB_OUTPUT"

      # Release, not Debug: a Release build bundles the JavaScript into the
      # .app, so the artifact is standalone and the launch below is real
      # evidence rather than a red "No bundle URL present" screen from a
      # Debug build looking for a Metro server that is not running.
      # Simulator keychain calls require an application identifier and an
      # access group. Xcode embeds these as simulated entitlements in the
      # executable; a CODE_SIGNING_ALLOWED=NO app reaches the loading screen
      # but SecItemCopyMatching fails with errSecMissingEntitlement (-34018).
      # The ad-hoc simulator identity is local to this job. Device archives
      # use the separate Apple distribution signing path below.
      - name: Prepare simulator keychain entitlements
        run: |
          python3 - "$RUNNER_TEMP/swarm-simulator.entitlements" <<'PY'
          import plistlib
          import sys

          app_id = 'SWARMSIM01.green.swarm.swarmwallet'
          with open(sys.argv[1], 'wb') as out:
              plistlib.dump({
                  'application-identifier': app_id,
                  'com.apple.developer.team-identifier': 'SWARMSIM01',
                  'keychain-access-groups': [app_id],
              }, out)
          PY

      - name: Check saved-wallet recovery
        run: |
          swiftc ios/WalletStore.swift ios/tests/WalletStoreChecks.swift -o "$RUNNER_TEMP/wallet-store-checks"
          "$RUNNER_TEMP/wallet-store-checks"

      - name: Build for the simulator (ad-hoc signed)
        working-directory: ios
        run: |
          set -euxo pipefail
          mkdir -p build/reports build/DerivedData
          xcodebuild build \
            -workspace Zingo.xcworkspace \
            -scheme Zingo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/reports/SwarmWallet-simulator.xcresult \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/swarm-simulator.entitlements" \
            DEVELOPMENT_TEAM=SWARMSIM01 \
            -quiet

      # C9 / E1: which hosts does a fresh install actually contact?
      #
      # The wallet talks gRPC over raw sockets, so nothing useful lands in the
      # simulator's own log — but the simulator's traffic leaves through the
      # runner's interface like anything else, so tcpdump answers it directly.
      # `dig` runs FIRST and on purpose: its answer is the address to match on
      # the wire, and priming the resolver cache only weakens the DNS half of
      # the evidence, never the connection half.
      #
      # Best effort throughout. If tcpdump cannot run, the run says so and the
      # settings-file assertion below still has to pass.
      - name: Start a packet capture (DNS and the indexer)
        id: capture
        continue-on-error: true
        run: |
          set -uo pipefail
          INDEXER_HOST=lwd-main.swarm.green
          IPS=$(dig +short "$INDEXER_HOST" A | grep -E '^[0-9.]+$' | sort -u | tr '\n' ' ')
          echo "$INDEXER_HOST resolves to: ${IPS:-(nothing)}"
          echo "indexer_host=$INDEXER_HOST" >> "$GITHUB_OUTPUT"
          echo "indexer_ips=$IPS" >> "$GITHUB_OUTPUT"
          # Asked before the app is blamed for not connecting: run
          # 35757559500 captured zero packets to the indexer, which reads
          # the same whether the app never tried or the runner cannot get
          # there. Never fatal — this is the network's answer, not the
          # build's.
          echo "--- can this runner reach the indexer? ---"
          for ip in $IPS; do
            if nc -z -G 8 -w 8 "$ip" 443 2>&1; then
              echo "ok      TCP 443 to $ip is open from this runner"
            else
              echo "::warning::TCP 443 to $ip is NOT reachable from this runner; the app cannot sync here whatever it does"
            fi
          done
          IFACE=any
          # DNS plus the indexer's own addresses, nothing else. A blanket
          # 'port 443' on a runner is mostly the runner's own log and
          # artifact traffic, which is not evidence about this app; and a
          # 128-byte snap keeps headers while storing no payload — this
          # capture becomes a public artifact.
          FILTER="port 53"
          for ip in $IPS; do FILTER="$FILTER or host $ip"; done
          echo "capture filter: $FILTER"
          sudo tcpdump -n -i "$IFACE" -s 128 -U -w "$RUNNER_TEMP/capture.pcap" \
            "$FILTER" >/dev/null 2>"$RUNNER_TEMP/tcpdump.err" &
          echo "tcpdump_pid=$!" >> "$GITHUB_OUTPUT"
          # Give it a moment to attach before the app starts talking.
          sleep 3
          if [ -f "$RUNNER_TEMP/capture.pcap" ]; then
            echo "capture started on $IFACE"
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::tcpdump did not start; the wire evidence will be missing"
            cat "$RUNNER_TEMP/tcpdump.err" || true
            echo "started=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, launch and screenshot
        id: launch
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"

          # No `| head`: under pipefail the writer dying of SIGPIPE would
          # fail the step for no reason. sed -n 1p reads to the end.
          APP=$(find ios/build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | sed -n '1p')
          test -n "$APP"
          echo "app bundle: $APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle identifier: $BID"

          # Everything this step used to assert about the bundle now lives in
          # "Assert the shipped bundle", which runs after the evidence has
          # been gathered and uploaded. Run 35741774745 is the reason: one
          # failed assertion here took the screenshots, the container dump
          # and the packet capture down with it, and the run reported a
          # verdict with nothing to show for it.
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" "$BID"

          mkdir -p artifacts
          # Immediately: the SWARM launch screen, before React Native has
          # drawn anything of its own.
          sleep 1
          xcrun simctl io "$UDID" screenshot artifacts/00-launchscreen-1s.png
          # At 15 s and 40 s the app has reached its LocalAuthentication
          # privacy gate, so these two frames ARE the authentication
          # sheet — the one that reads "Enter iPhone Passcode for
          # <CFBundleDisplayName>". Named so a reviewer knows to read the
          # text rather than glance at the picture.
          sleep 14
          xcrun simctl io "$UDID" screenshot artifacts/01-auth-sheet-15s.png
          sleep 25
          xcrun simctl io "$UDID" screenshot artifacts/02-auth-sheet-40s.png

          # Still alive 40 s after launch? A crash-on-start would be gone.
          # Captured first and matched in the shell: piping into `grep -q`
          # kills the writer with SIGPIPE on the first match, and under
          # pipefail that reads as "not running" when it IS running.
          RUNNING=$(xcrun simctl spawn "$UDID" launchctl list || true)
          if [[ "$RUNNING" == *"$BID"* ]]; then
            echo "STILL RUNNING after 40s: $BID"
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$BID is not running 40 s after launch"
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi

          # Home screen, where the app icon and the display name show.
          xcrun simctl terminate "$UDID" "$BID" || true
          sleep 4
          xcrun simctl io "$UDID" screenshot artifacts/03-home-screen.png

          # The first launch above records the real device-auth shutter. A
          # headless runner cannot answer its system sheet reliably, so turn
          # off only that preference in this disposable simulator and relaunch
          # to exercise the keychain, risk notice and wallet creation path.
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          SETTINGS="$CONTAINER/Documents/settings.json"
          python3 - "$SETTINGS" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path) as source:
              settings = json.load(source)
          security = settings['security']
          security['startApp'] = False
          security['foregroundApp'] = False
          security['changeWalletScreen'] = False
          with open(path, 'w') as target:
              json.dump(settings, target)
          PY
          # Attached to a pseudo-terminal, so the app's own stdout and stderr
          # land in a file. That is where React Native writes every
          # `console.log`/`console.warn`/`console.error`, including the one
          # `AppErrorBoundary` writes when a render throws. Without this the
          # only record of a JavaScript fault is a screenshot of whatever the
          # app fell back to, which is how the risk-notice regression got as
          # far as a red run with no cause in it. Backgrounded: the launch
          # blocks until the app exits, and it has to stay alive through the
          # Maestro walk that follows.
          nohup xcrun simctl launch --console-pty "$UDID" "$BID" \
            > artifacts/app-console.txt 2>&1 &
          disown || true
          sleep 30
          xcrun simctl io "$UDID" screenshot artifacts/04-risk-notice.png

          xcrun simctl spawn "$UDID" log show --last 8m --style compact \
            --predicate "processImagePath CONTAINS[c] 'Zingo'" \
            > artifacts/app-log.txt 2>&1 || true

          {
            echo "app_path=$APP"
            echo "bundle_id=$BID"
          } >> "$GITHUB_OUTPUT"

      # The final gate checks this result after collecting the evidence.
      - name: Walk wallet creation, Send and Receive with Maestro
        id: maestro
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          BID="${{ steps.launch.outputs.bundle_id }}"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          export MAESTRO_CLI_NO_ANALYTICS=1
          if ! curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.10.0 bash; then
            echo "::warning::could not install Maestro; skipping the UI walk"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version || true
          mkdir -p artifacts evidence
          if maestro --device "$UDID" test --test-output-dir "$RUNNER_TEMP/maestro-flow" \
            --format JUNIT --output evidence/maestro.xml \
            -e APP_ID="$BID" .maestro/ios_fresh_install.yaml; then
            echo "Maestro walked the fresh install to the home screen"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the Maestro walk did not finish; the screenshots below are whatever it reached"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          find "$RUNNER_TEMP/maestro-flow" -path '*/takeScreenshot/*.png' \
            -exec cp {} artifacts/ \;
          xcrun simctl io "$UDID" screenshot artifacts/06-after-maestro.png || true
          maestro --device "$UDID" hierarchy > evidence/view-hierarchy.txt 2>&1 || true

      # The log that matters is the one from DURING the walk. The capture in
      # the launch step above runs before Maestro has touched anything, so a
      # JavaScript exception thrown while the walk taps through the app was
      # never in any artifact. This step runs after the walk, always, and
      # writes next to it.
      - name: Capture the app log after the walk
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p artifacts
          # Everything the process emitted, wide enough to cover both launches
          # and the whole Maestro walk.
          xcrun simctl spawn "$UDID" log show --last 30m --style compact \
            --predicate "processImagePath CONTAINS[c] 'Zingo'" \
            > artifacts/app-log-after-maestro.txt 2>&1 || true
          # React Native's console output, and any crash report the runtime
          # wrote, filtered out of the system noise so a reader finds the
          # cause without paging through FrontBoard chatter.
          grep -inE "error|exception|TypeError|undefined is not|not a function|AppErrorBoundary|Invariant|RCTFatal|JavaScript|facebook.react" \
            artifacts/app-log-after-maestro.txt \
            > artifacts/app-log-errors.txt 2>&1 || true
          echo "==== app console (stdout/stderr of the app itself) ===="
          tail -n 200 artifacts/app-console.txt 2>/dev/null || echo "(no console capture)"
          echo "==== log lines that look like faults ===="
          tail -n 120 artifacts/app-log-errors.txt 2>/dev/null || echo "(none)"

      # These screenshots come from this build on this simulator. They record
      # first-launch state for review.
      #
      # Earlier unsigned runs reached the iOS passcode sheet, then stayed on
      # "Creating a new wallet" because keychain queries lacked simulator
      # entitlements. The TCP check in run 35909981590 reached
      # lwd-main.swarm.green:443. These captures document the runner state. The composer
      # can produce Apple's 6.9-inch class after real wallet screens are captured:
      #   python scripts/store/build_store_art.py --preset ios69 \
      #     --raw <captures> --out fastlane/screenshots/en-US
      - name: Collect the store screens
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p store-out
          cp artifacts/00-launchscreen-1s.png store-out/01-launch.png 2>/dev/null || true
          cp artifacts/01-auth-sheet-15s.png store-out/02-unlock.png 2>/dev/null || true
          cp artifacts/04-risk-notice.png store-out/03-risk-notice.png 2>/dev/null || true
          xcrun simctl io "$UDID" screenshot store-out/04-final-state.png 2>/dev/null || true
          ls -la store-out || true
          echo "ok      the screens this build produced on this runner are in store-out/"

      - name: Upload the store screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-store-screens
          path: store-out/
          retention-days: 30
          if-no-files-found: ignore

      # THE assertion of C9: on a fresh install, with nothing typed and nothing
      # chosen, is the server already lwd-main.swarm.green on swarm-mainnet, and did
      # the app actually go there?
      - name: Fresh install — prove the default server and the connection
        id: freshinstall
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          BID="${{ steps.launch.outputs.bundle_id }}"
          # Its own directory: artifacts/ is uploaded whole as the
          # screenshot artifact, and the capture has no business in there.
          mkdir -p evidence

          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          echo "data container: $CONTAINER"
          echo "--- everything the fresh install wrote ---"
          find "$CONTAINER" -maxdepth 4 | sed "s|$CONTAINER|<container>|" | head -80
          find "$CONTAINER" -maxdepth 4 | sed "s|$CONTAINER|<container>|" > evidence/container-tree.txt 2>/dev/null || true

          SETTINGS="$CONTAINER/Documents/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "::error::the app wrote no settings.json, so it never got as far as choosing a server"
            exit 1
          fi
          cp "$SETTINGS" evidence/settings.json
          echo "--- settings.json as the fresh install left it ---"
          cat "$SETTINGS"
          echo

          python3 - "$SETTINGS" <<'PY'
          import json, sys
          settings = json.load(open(sys.argv[1]))
          server = settings.get('server') or {}
          uri = server.get('uri')
          chain = server.get('chainName')
          print('server.uri       =', uri)
          print('server.chainName =', chain)
          bad = 0
          expected_uri = 'https://lwd-main.swarm.green:443'
          if uri != expected_uri:
              print("::error::the fresh install's default server is %r, expected %s. A reviewer would have to choose one" % (uri, expected_uri))
              bad = 1
          if chain != 'swarm-mainnet':
              print('::error::the default chain is %r, expected swarm-mainnet' % (chain,))
              bad = 1
          sys.exit(bad)
          PY
          echo "ok      the default server is lwd-main.swarm.green on swarm-mainnet, with no user action"

          WALLET="$CONTAINER/Documents/wallet.dat.txt"
          if [ -s "$WALLET" ]; then
            echo "ok      a wallet file exists, so the fresh install created and saved one:"
            ls -l "$WALLET"
            echo "wallet_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "note    no wallet file yet — the risk notice is still waiting for its tap"
            echo "wallet_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the packet capture back
        id: wire
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          sudo pkill -INT tcpdump || true
          sleep 2
          PCAP="$RUNNER_TEMP/capture.pcap"
          mkdir -p evidence
          if [ ! -s "$PCAP" ]; then
            echo "::warning::no packet capture; the wire evidence is missing from this run"
            echo "proved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo chmod a+r "$PCAP"
          cp "$PCAP" evidence/fresh-install-capture.pcap
          sudo tcpdump -n -r "$PCAP" > "$RUNNER_TEMP/capture.txt" 2>/dev/null || true
          echo "packets captured: $(wc -l < "$RUNNER_TEMP/capture.txt" | tr -d ' ')"

          DNS=$(grep -c 'lwd-main.swarm.green' "$RUNNER_TEMP/capture.txt" || true)
          echo "DNS lines naming the indexer: $DNS"

          HITS=0
          # Quoted into a variable first: an empty expansion here would be a
          # bare `for ip in ; do`, which is a syntax error, not an empty loop.
          IPS="${{ steps.capture.outputs.indexer_ips }}"
          for ip in $IPS; do
            n=$(grep -c "$ip.443" "$RUNNER_TEMP/capture.txt" || true)
            echo "packets to $ip:443 = $n"
            HITS=$((HITS + n))
          done
          {
            echo "indexer host: ${{ steps.capture.outputs.indexer_host }}"
            echo "indexer ips:  ${{ steps.capture.outputs.indexer_ips }}"
            echo "dns lines:    $DNS"
            echo "packets:      $HITS"
            echo
            grep -E 'lwd-main.swarm.green' "$RUNNER_TEMP/capture.txt" | head -40 || true
          } > evidence/fresh-install-wire.txt
          if [ "$HITS" -gt 0 ]; then
            echo "ok      the fresh install really did talk to the indexer on 443"
            echo "proved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no packets to the indexer's address were captured; this proves nothing either way (the capture may have missed them)"
            echo "proved=false" >> "$GITHUB_OUTPUT"
          fi

      # The verdict on what would be uploaded to Apple, read from the built
      # .app rather than from the sources it was meant to come from. It runs
      # LAST, and always, so that a "no" arrives with the screenshots, the
      # container dump and the packet capture already gathered — run
      # 35741774745 failed here first and reported a verdict with nothing to
      # show for it.
      - name: Assert the shipped bundle
        if: always()
        run: |
          set -euo pipefail
          APP=$(find ios/build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | sed -n '1p')
          if [ -z "$APP" ]; then
            echo "::error::no built .app to assert on"
            exit 1
          fi
          PLIST="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" 2>/dev/null || echo '(none)')
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "app bundle:        $APP"
          echo "bundle identifier: $BID"
          echo "display name:      $NAME"
          echo "version (build):   $SHORT ($BUILD)"

          # The build number is the one thing App Store Connect checks before
          # it looks at the app at all, so prove it landed in the bundle
          # rather than trusting the command line.
          if [ "$SHORT" != "${{ steps.version.outputs.marketing }}" ]; then
            echo "::error::CFBundleShortVersionString is '$SHORT', expected '${{ steps.version.outputs.marketing }}'"
            exit 1
          fi
          if [ "$BUILD" != "${{ steps.version.outputs.build }}" ]; then
            echo "::error::CFBundleVersion is '$BUILD', expected '${{ steps.version.outputs.build }}' — the run-number build number did not reach the bundle"
            exit 1
          fi
          if [ "$BUILD" -le 1 ]; then
            echo "::error::CFBundleVersion $BUILD is not greater than 1"
            exit 1
          fi
          echo "ok      version and build number reached the bundle"

          # The passcode sheet iOS puts up for LocalAuthentication is titled
          # with CFBundleDisplayName. Asserting it is what makes the sheet in
          # the screenshot verifiable rather than only reviewable.
          if [ "$NAME" != "SWARM Wallet" ]; then
            echo "::error::CFBundleDisplayName is '$NAME', expected 'SWARM Wallet' — the iOS authentication sheet would show the wrong name"
            exit 1
          fi
          if [ "$BID" != "green.swarm.swarmwallet" ]; then
            echo "::error::CFBundleIdentifier is '$BID', expected 'green.swarm.swarmwallet'"
            exit 1
          fi
          echo "ok      SWARM Wallet / green.swarm.swarmwallet"

          # C10: the project references the ROOT ios/PrivacyInfo.xcprivacy,
          # not the one in ios/Zingo/. Apple reads the manifest that is
          # actually bundled, so read THAT one and say which source file it
          # is, byte for byte.
          echo "--- privacy manifest shipped in the .app ---"
          MANIFEST="$APP/PrivacyInfo.xcprivacy"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::no PrivacyInfo.xcprivacy in the built app — Apple rejects uploads without one"
            exit 1
          fi
          SHIPPED_SHA=$(shasum -a 256 "$MANIFEST" | cut -d' ' -f1)
          ROOT_SHA=$(shasum -a 256 ios/PrivacyInfo.xcprivacy | cut -d' ' -f1)
          ZINGO_SHA=$(shasum -a 256 ios/Zingo/PrivacyInfo.xcprivacy | cut -d' ' -f1)
          echo "shipped sha256:            $SHIPPED_SHA"
          echo "ios/PrivacyInfo.xcprivacy: $ROOT_SHA"
          echo "ios/Zingo/PrivacyInfo…:    $ZINGO_SHA"
          if [ "$SHIPPED_SHA" = "$ROOT_SHA" ]; then
            echo "the app ships: ios/PrivacyInfo.xcprivacy (the root file)"
          elif [ "$SHIPPED_SHA" = "$ZINGO_SHA" ]; then
            echo "the app ships: ios/Zingo/PrivacyInfo.xcprivacy"
          else
            echo "the app ships: NEITHER source file byte for byte — Xcode rewrote it"
          fi
          /usr/libexec/PlistBuddy -c 'Print' "$MANIFEST"
          manifest_missing=0
          for k in NSPrivacyTracking NSPrivacyCollectedDataTypes NSPrivacyAccessedAPITypes; do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$MANIFEST" >/dev/null 2>&1; then
              echo "ok      $k present"
            else
              echo "MISSING $k"
              manifest_missing=$((manifest_missing + 1))
            fi
          done
          if [ "$manifest_missing" -gt 0 ]; then
            echo "::error::the BUNDLED privacy manifest is missing $manifest_missing required key(s); Apple reads this file, not the one you meant"
            exit 1
          fi
          TRACKING=$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' "$MANIFEST")
          if [ "$TRACKING" != "false" ]; then
            echo "::error::NSPrivacyTracking is '$TRACKING'; this app tracks nobody and must say false"
            exit 1
          fi
          echo "ok      NSPrivacyTracking = false"

          # B1: no push entitlement, no remote-notification mode. An
          # entitlement the App ID does not carry is refused by the
          # provisioning profile, which would fail the first upload.
          echo "--- background modes and push entitlement ---"
          MODES=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST" 2>/dev/null || echo '(none)')
          echo "$MODES"
          if printf '%s' "$MODES" | grep -q 'remote-notification'; then
            echo "::error::UIBackgroundModes still declares remote-notification, but nothing in this app registers for remote notifications"
            exit 1
          fi
          echo "ok      no remote-notification background mode"
          if codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'aps-environment'; then
            echo "::error::the built app still carries the aps-environment entitlement"
            exit 1
          fi
          echo "ok      no aps-environment entitlement in the built app"

          # A3/A4: iPhone-only, and no stray macOS key.
          FAMILY=$({ /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$PLIST" 2>/dev/null || echo '?'; } | tr -d ' \n')
          echo "UIDeviceFamily: $FAMILY"
          if printf '%s' "$FAMILY" | grep -q '2'; then
            echo "::error::UIDeviceFamily still includes iPad (2); TARGETED_DEVICE_FAMILY must be 1"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST" >/dev/null 2>&1; then
            echo "::error::LSMinimumSystemVersion (a macOS key) is still in the iOS Info.plist"
            exit 1
          fi
          echo "ok      iPhone-only, no LSMinimumSystemVersion"

          echo "--- URL schemes claimed by this build (expect none) ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$PLIST" \
            2>/dev/null || echo "(no CFBundleURLTypes — the zcash: claim is gone)"
          echo "--- app icons compiled into the bundle ---"
          ls "$APP" | grep -i '^AppIcon' || echo "(none)"

          echo "--- launch screen compiled into the bundle ---"
          test -e "$APP/LaunchScreen.storyboardc" \
            || { echo "::error::LaunchScreen.storyboardc missing from the app bundle"; exit 1; }
          LSN=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST" 2>/dev/null || echo '(unset)')
          if [ "$LSN" != "LaunchScreen" ]; then
            echo "::error::UILaunchStoryboardName is '$LSN', expected 'LaunchScreen'"
            exit 1
          fi
          echo "ok      LaunchScreen.storyboardc present and named"

          # Every face named in UIAppFonts must actually be in the bundle. A
          # missing one is silent at runtime — iOS falls back to the system
          # face — so it has to be caught here or not at all.
          echo "--- bundled typefaces ---"
          missing=0
          for f in $(/usr/libexec/PlistBuddy -c 'Print :UIAppFonts' "$PLIST" \
                     | sed -n 's/^ *\(fonts\/.*\.ttf\) *$/\1/p'); do
            if [ -f "$APP/$f" ]; then
              echo "ok      $f"
            else
              echo "MISSING $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing font(s) declared in UIAppFonts are not in the app bundle; the SWARM typefaces would silently fall back to the system face"
            exit 1
          fi

          # ----------------------------------------------------------- B4
          # The location purpose string is deleted, so nothing that a person
          # can reach may ask for a position.
          #
          # This is asserted on the MECHANISM, not on the binary, and runs
          # 35737908538 and 35741774745 are why. Neither the load commands
          # nor the symbol table can tell code that runs from code that is
          # merely compiled, and this binary provably contains the latter:
          #
          #   * React Native compiles RCTConvert+CoreLocation into
          #     React-Core, so every RN app links CoreLocation.
          #   * VisionCamera compiles ios/Core/**/*.swift unconditionally, so
          #     LocationProvider (a CLLocationManager and a
          #     startUpdatingLocation in its init) and
          #     CLLocationManager+requestAccess (a
          #     requestWhenInUseAuthorization) are in the binary whatever the
          #     flag says. What $VCEnableLocation = false removes is every
          #     CALL SITE: the only LocationProvider() construction,
          #     requestLocationPermission and getLocationPermissionStatus are
          #     each inside #if VISION_CAMERA_ENABLE_LOCATION and, with the
          #     condition unset, throw locationNotEnabled or return
          #     .restricted instead.
          #   * react-native-device-info calls four CLLocationManager CLASS
          #     methods that only read status. None prompts, none needs a
          #     purpose string, and this app never calls the JS that reaches
          #     them.
          #
          # So the two things that CAN be asserted exactly are asserted: the
          # compilation condition that gates every call site is absent, and
          # this repository's own code contains no location API at all.
          echo "--- location: the gate, not the symbol table ---"
          # The path has spaces in it, so the file list travels NUL-separated
          # and each name is quoted. Run 35757559500 did neither: every grep
          # failed with "No such file or directory", the failing `grep -l`
          # sent the `if` down the ok branch, and the check passed without
          # ever reading a file.
          XCDIR="ios/Pods/Target Support Files"
          COUNT=$(find "$XCDIR" -name 'VisionCamera*.xcconfig' 2>/dev/null | grep -c . || true)
          if [ "$COUNT" = "0" ]; then
            echo "::error::no VisionCamera xcconfig under $XCDIR — cannot prove the location gate either way"
            exit 1
          fi
          echo "$COUNT VisionCamera xcconfig(s):"
          gate_on=0
          while IFS= read -r -d '' f; do
            echo "    $f"
            grep -n 'SWIFT_ACTIVE_COMPILATION_CONDITIONS' "$f" | sed 's/^/        /' || true
            if grep -q 'VISION_CAMERA_ENABLE_LOCATION' "$f"; then
              gate_on=$((gate_on + 1))
            fi
          done < <(find "$XCDIR" -name 'VisionCamera*.xcconfig' -print0 2>/dev/null)
          if [ "$gate_on" -gt 0 ]; then
            echo "::error::VISION_CAMERA_ENABLE_LOCATION appears in $gate_on VisionCamera xcconfig(s), so its location call sites ARE compiled. Either \$VCEnableLocation = false has been removed from ios/Podfile, or a pod update changed the flag — and NSLocationWhenInUseUsageDescription plus the privacy policy would have to come back with it"
            exit 1
          fi
          echo "ok      VISION_CAMERA_ENABLE_LOCATION is unset in all $COUNT: every VisionCamera location call site is compiled out"

          OWN=$(grep -rnE 'CLLocationManager|requestWhenInUseAuthorization|requestAlwaysAuthorization|startUpdatingLocation|isLocationEnabled|getAvailableLocationProviders|Geolocation' \
                app screens ui ios/*.swift 2>/dev/null || true)
          if [ -n "$OWN" ]; then
            printf '%s\n' "$OWN" | sed 's/^/    /'
            echo "::error::this repository's own code now reaches a location API; NSLocationWhenInUseUsageDescription and the privacy policy would have to come back"
            exit 1
          fi
          echo "ok      no location API in app/, screens/, ui/ or ios/*.swift"

          if /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$PLIST" >/dev/null 2>&1; then
            echo "::error::NSLocationWhenInUseUsageDescription is back in Info.plist, but nothing reachable asks for a position"
            exit 1
          fi
          echo "ok      no location purpose string ships"

          # Notes, not gates: what the binary happens to link and reference.
          echo "--- what the binary links and references (notes) ---"
          EXE="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          LINKED=$(otool -L "$EXE" || true)
          SYMS=$(nm -u "$EXE" 2>/dev/null || true)
          printf '%s\n' "$LINKED" | sed 's/^/    /'
          for fw in CoreLocation Photos; do
            if printf '%s' "$LINKED" | grep -qi "$fw"; then
              echo "note    $fw is in the load commands"
            else
              echo "note    $fw is not linked"
            fi
          done
          printf '%s' "$SYMS" | grep -E 'CLLocation|PHPhoto|PHAsset' | sed 's/^/    /' || echo "    (no CoreLocation or Photos class references)"
          # PHAsset counts. Run 35757559500 printed _OBJC_CLASS_$_PHAsset two
          # lines above a note saying there was no photo-library reference,
          # because the pattern only looked for PHPhotoLibrary and
          # PHAssetCreationRequest.
          if printf '%s' "$SYMS" | grep -qE 'PHPhotoLibrary|PHAsset|PHImageManager'; then
            echo "note    a Photos class is referenced, so something in the build can reach the library — NSPhotoLibraryAddUsageDescription stays"
          else
            echo "note    no Photos class reference at all: NSPhotoLibraryAddUsageDescription may describe a feature that does not exist. Left in place because deleting a purpose string a pod reaches dynamically is a crash, not a warning."
          fi

          echo
          echo "THE SHIPPED BUNDLE PASSES."

      - name: Require wallet creation and the screen walk
        if: always()
        env:
          WALLET_CREATED: ${{ steps.freshinstall.outputs.wallet_created }}
          SCREEN_WALK_OK: ${{ steps.maestro.outputs.ok }}
        run: |
          set -euo pipefail
          if [ "$WALLET_CREATED" != "true" ] || [ "$SCREEN_WALK_OK" != "true" ]; then
            echo "::error::Wallet creation and the Receive/Send screen walk must pass."
            exit 1
          fi

      # always(): a failed assertion must still leave the artifact it was
      # reached from, so the next person can look instead of guessing.
      - name: Package the simulator app
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.launch.outputs.app_path }}" \
            dist/SwarmWallet-simulator.app.zip
          cd dist
          shasum -a 256 SwarmWallet-simulator.app.zip > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Build summary
        if: always()
        run: |
          {
            echo "### SWARM iOS simulator build"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| marketing version | \`${{ steps.version.outputs.marketing }}\` |"
            echo "| build number (CURRENT_PROJECT_VERSION) | \`${{ steps.version.outputs.build }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| Xcode | \`$(xcodebuild -version | head -1)\` |"
            echo "| simulator runtime | \`${{ steps.sim.outputs.runtime }}\` |"
            echo "| simulator device | \`${{ steps.sim.outputs.devicetype }}\` |"
            echo "| bundle identifier | \`${{ steps.launch.outputs.bundle_id }}\` |"
            echo "| running 40 s after launch | \`${{ steps.launch.outputs.alive }}\` |"
            echo "| default server (fresh install) | \`https://lwd-main.swarm.green:443\`, asserted from the app container |"
            echo "| wallet created with no user action | \`${{ steps.freshinstall.outputs.wallet_created }}\` |"
            echo "| reached the indexer on the wire | \`${{ steps.wire.outputs.proved }}\` |"
            echo "| Maestro walked to the home screen | \`${{ steps.maestro.outputs.ok }}\` |"
            echo "| code signing | \`ad-hoc simulator signature with keychain entitlements\` |"
            if [ -f dist/SHA256SUMS ]; then
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulator app + checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-simulator-app
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload launch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-simulator-screenshot
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the fresh-install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-freshinstall-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload xcresult bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-xcresult
          path: ios/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Does anything a person can SEE still say Zingo?
  #
  # Its own job on purpose. The build either works or it does not, and
  # that answer should stay readable; whether the shared JavaScript has
  # finished being rebranded is a different question with a different
  # owner. So app-simulator stays green when the app builds, and this
  # job goes red for as long as a user-visible string still says Zingo.
  #
  # Today it is EXPECTED TO FAIL: app/translations/*.json (5 languages,
  # 42 hits each) and the donation screens still carry ZingoLabs, Zennies
  # and zingolabs.org. Those are shared JavaScript, owned by the Android
  # agent's branch, and must be fixed once for both platforms rather than
  # twice. The iOS-native side — display name, permission prompts, launch
  # screen, URL-scheme claim — is already clean, which is what the
  # assertions in app-simulator prove.
  # ---------------------------------------------------------------------
  string-sweep:
    name: User-visible string sweep (fails while any Zingo is visible)
    needs: app-simulator
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: swarm-ios-simulator-app
          path: dist

      - name: Unpack
        run: |
          set -euxo pipefail
          mkdir -p unpacked
          ditto -x -k dist/SwarmWallet-simulator.app.zip unpacked
          find unpacked -maxdepth 1 -name '*.app'

      - name: Sweep
        run: |
          set -uo pipefail
          APP=$(find unpacked -maxdepth 1 -name '*.app' -type d | sed -n '1p')
          bash ios/scripts/string-sweep.sh "$APP" | tee string-sweep.txt
          status=${PIPESTATUS[0]}
          {
            echo "### User-visible string sweep"
            echo
            echo '```'
            cat string-sweep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-ios-string-sweep
          path: string-sweep.txt
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------
  # Signed device archive + TestFlight upload.
  #
  # The signed job targets the existing App ID green.swarm.swarmwallet.
  # It runs only on a signed workflow dispatch with the required secrets.
  # Signing material belongs in GitHub Secrets.
  #
  # TWO SIGNING PATHS, chosen by which secrets exist:
  #
  #   automatic (four secrets, preferred) — the API key alone. xcodebuild
  #     runs with -allowProvisioningUpdates and the authentication key, and
  #     Xcode creates and downloads the distribution certificate and the
  #     App Store profile itself. Nobody exports a .p12, so no certificate
  #     file and no certificate password ever exist outside Apple.
  #
  #   manual (seven secrets) — the path this job shipped first: a .p12 and
  #     a .mobileprovision imported into a throwaway keychain. Kept because
  #     it is the one that works when the team's certificates are managed
  #     elsewhere and Xcode may not mint new ones.
  #
  # The API key is required either way: it is what uploads the build.
  # ---------------------------------------------------------------------
  signed-release:
    name: Signed archive + TestFlight (needs an Apple organisation account)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
    needs: [app-simulator, string-sweep]
    runs-on: macos-latest
    timeout-minutes: 120
    environment: apple-distribution
    steps:
      # The refusal. Four secrets are always required; the certificate trio
      # is required only when a certificate is supplied at all. Values are
      # tested for emptiness and never printed.
      - name: Choose the signing path, or refuse to run
        id: signing
        env:
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_KEY_P8: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_P8 }}
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for v in APPLE_TEAM_ID APPLE_APP_STORE_CONNECT_KEY_ID \
                   APPLE_APP_STORE_CONNECT_ISSUER_ID APPLE_APP_STORE_CONNECT_KEY_P8; do
            if [ -z "${!v:-}" ]; then echo "missing secret: $v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::This job needs an Apple Developer Program organisation account and an App Store Connect API key. See docs/SWARM-IOS.md."
            exit 1
          fi

          if [ -n "${APPLE_DISTRIBUTION_CERT_P12:-}" ]; then
            for v in APPLE_DISTRIBUTION_CERT_PASSWORD APPLE_PROVISIONING_PROFILE; do
              if [ -z "${!v:-}" ]; then echo "missing secret: $v"; missing=1; fi
            done
            if [ "$missing" = "1" ]; then
              echo "::error::A distribution certificate was supplied but its password or provisioning profile was not. Supply all three, or none of them and let the API key provision automatically."
              exit 1
            fi
            STYLE=manual
          else
            STYLE=automatic
          fi
          echo "signing style: $STYLE"
          echo "style=$STYLE" >> "$GITHUB_OUTPUT"

      - name: Pin Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Checkout
        uses: actions/checkout@v4

      # The same rule as the simulator job, so a dispatch and the push that
      # preceded it cannot collide on a build number.
      - name: Derive the build number
        id: version
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))
          if [ "$BUILD_NUMBER" -le 1 ]; then
            echo "::error::derived build number $BUILD_NUMBER is not greater than 1"
            exit 1
          fi
          echo "marketing version: $MARKETING_VERSION"
          echo "build number:      $BUILD_NUMBER"
          {
            echo "build=$BUILD_NUMBER"
            echo "marketing=$MARKETING_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Download the xcframework
        uses: actions/download-artifact@v4
        with:
          name: swarm-ios-xcframework
          path: ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Install librsvg (SVG renderer)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install librsvg

      - name: Render the app icon and launch mark from SVG
        run: |
          set -euo pipefail
          bash ios/scripts/generate-ios-art.sh
          test -s ios/Zingo/Images.xcassets/AppIcon-Prod.appiconset/Icon-1024.png
          test -s ios/Zingo/Images.xcassets/LaunchMark.imageset/LaunchMark@3x.png

      - name: Pod install
        run: cd ios && pod install

      # Both paths need the key: automatic signing authenticates xcodebuild
      # with it, and every path uploads with it. Written outside the
      # checkout, in two places because xcodebuild wants a path and altool
      # wants its own directory. Deleted in the cleanup step.
      - name: Write the App Store Connect API key
        id: apikey
        env:
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_KEY_P8: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APPLE_APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          # Shape only — never the contents.
          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::the decoded API key is empty; APPLE_APP_STORE_CONNECT_KEY_P8 must be the .p8 file, base64-encoded"
            exit 1
          fi
          echo "api key written ($(wc -c < "$KEY_PATH" | tr -d ' ') bytes)"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # A throwaway keychain that exists only for this job. Manual path only.
      - name: Import signing material into a temporary keychain
        if: steps.signing.outputs.style == 'manual'
        env:
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/swarm-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo -n "$APPLE_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/swarm.mobileprovision"
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Archive for a physical device (manual signing)
        if: steps.signing.outputs.style == 'manual'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace Zingo.xcworkspace \
            -scheme Zingo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SwarmWallet.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      # No certificate anywhere: Xcode asks App Store Connect for the
      # signing assets with the API key and creates what it is missing.
      #
      - name: Archive for a physical device (automatic signing, API key)
        if: steps.signing.outputs.style == 'automatic'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace Zingo.xcworkspace \
            -scheme Zingo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SwarmWallet.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.apikey.outputs.path }}" \
            -authenticationKeyID "$APPLE_APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_APP_STORE_CONNECT_ISSUER_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Read the archive back
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SwarmWallet.xcarchive/Products/Applications/Zingo.app"
          PLIST="$APP/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")
          LAUNCH=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST")
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$PLIST")
          echo "archived $BID $SHORT ($BUILD)"
          if [ "$BUILD" != "${{ steps.version.outputs.build }}" ]; then
            echo "::error::the archive carries build $BUILD, expected ${{ steps.version.outputs.build }}"
            exit 1
          fi
          if [ "$BID" != "green.swarm.swarmwallet" ]; then
            echo "::error::the archive carries bundle id $BID"
            exit 1
          fi
          if [ "$NAME" != "SWARM Wallet" ] || [ "$LAUNCH" != "LaunchScreen" ] || [ "$ICON" != "AppIcon-Prod" ]; then
            echo "::error::the archive has the wrong display name, launch screen or icon"
            exit 1
          fi
          test -d "$APP/LaunchScreen.storyboardc"
          test -s "$APP/Assets.car"
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/swarm-assets.json"
          grep -Fq 'AppIcon-Prod' "$RUNNER_TEMP/swarm-assets.json"
          grep -Fq 'LaunchMark' "$RUNNER_TEMP/swarm-assets.json"

      - name: Export a signed .ipa
        id: export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          SIGNING_STYLE: ${{ steps.signing.outputs.style }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_STYLE" = "manual" ]; then STYLE=manual; else STYLE=automatic; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>${STYLE}</string>
          </dict></plist>
          PLIST
          # Two explicit calls rather than an argument array: macOS
          # runners still run bash 3.2, where an EMPTY array expanded as
          # "${arr[@]}" under `set -u` is an unbound-variable error.
          if [ "$STYLE" = "automatic" ]; then
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/SwarmWallet.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "${{ steps.apikey.outputs.path }}" \
              -authenticationKeyID "$APPLE_APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APPLE_APP_STORE_CONNECT_ISSUER_ID"
          else
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/SwarmWallet.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          fi
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | sed -n '1p')
          test -n "$IPA"
          SHA=$(shasum -a 256 "$IPA" | cut -d' ' -f1)
          echo "ipa:    $IPA"
          echo "sha256: $SHA"
          {
            echo "ipa=$IPA"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        id: upload
        env:
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "${{ steps.export.outputs.ipa }}" -t ios \
            --apiKey "$APPLE_APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPLE_APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.txt"
          DELIVERY=$(sed -n 's/.*[Dd]elivery [Uu][Uu][Ii][Dd]: *\([0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/altool.txt" | sed -n '1p')
          echo "delivery=${DELIVERY:-unknown}" >> "$GITHUB_OUTPUT"

      # D6 of the build requirements: the release is recorded, with the
      # build number, the commit and the SHA-256 of what was uploaded.
      - name: Release summary
        if: always()
        run: |
          {
            echo "### SWARM iOS signed release"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| signing style | \`${{ steps.signing.outputs.style }}\` |"
            echo "| marketing version | \`${{ steps.version.outputs.marketing }}\` |"
            echo "| build number | \`${{ steps.version.outputs.build }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| ipa sha256 | \`${{ steps.export.outputs.sha256 }}\` |"
            echo "| delivery uuid | \`${{ steps.upload.outputs.delivery }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy the temporary keychain and key material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/swarm-signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
          rm -f "$RUNNER_TEMP/dist.p12" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/swarm.mobileprovision" || true
