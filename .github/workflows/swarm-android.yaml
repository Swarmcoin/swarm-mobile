name: SWARM Android

# Builds the SWARM Wallet Android app end to end on GitHub-hosted runners:
# JS checks, the Rust wallet library for the three device ABIs, a debug-signed
# APK the owner can sideload, and - when the upload key is configured - the
# Android App Bundle Google Play accepts.
#
# Upstream's own Android workflows target self-hosted runners
# (`zingo-android-native-16`, `zingo-android-gradle-16`) that this project does
# not have, so this workflow stands beside them rather than replacing them. It
# reuses upstream's builder image, which carries the Android NDK.
#
# The `apk` job never signs with anything but the checked-in
# `android/app/debug.keystore`: its output is DEBUG-SIGNED, installable by
# sideloading and never publishable.
#
# The `bundle` job builds the Play upload. It needs four repository secrets -
# SWARM_UPLOAD_KEYSTORE_B64, SWARM_UPLOAD_KEYSTORE_PASSWORD,
# SWARM_UPLOAD_KEY_ALIAS and SWARM_UPLOAD_KEY_PASSWORD - and skips cleanly
# when they are absent. No key material is committed here, and the decoded
# keystore lives in the runner's temp directory for the length of the job.
#
# A release-signed build carries a different certificate from the debug-signed
# one, so Android refuses to install it over the sideloaded app. See
# docs/SWARM-ANDROID.md, "Google Play".

on:
  workflow_dispatch:
    inputs:
      run-emulator-smoke:
        description: 'Run the emulator smoke test'
        required: false
        type: boolean
        default: true
  push:
    branches: [swarm-mobile, play-release, codex/mobile-mainnet-20260926]

concurrency:
  group: swarm-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SWARM app version. This round is the fifth MAINNET build: the wallet
  # opens on SWARM Mainnet (https://lwd-main.swarm.green:443, genesis
  # 01b76d8a0f18c502b23ab6605e26296d189aa5770fc4a34155e5c7b250a0eff2, the chain
  # restarted on 2026-10-02) and the
  # engineering testnet is a second, clearly-labelled choice. See docs/MAINNET.md.
  # 0.2.0-mainnet.1 was versionCode 4, 0.2.0-mainnet.2 versionCode 5,
  # 0.2.0-mainnet.3 versionCode 6 and 0.2.0-mainnet.4 versionCode 7. A version
  # string never names two builds.
  SWARM_VERSION: 0.2.0-mainnet.5
  # versionCode must increase for every Play upload; bump it here. Play keeps
  # every code it has ever seen and refuses a repeat, including one from a
  # release that was later deleted.
  SWARM_ANDROID_VERSION_CODE: 8
  # Play shows this string. It stays a plain three-part version; which network
  # the build is for is said by SWARM_VERSION, by the release notes and by the
  # app itself, not by a suffix Play would have to parse.
  SWARM_ANDROID_VERSION_NAME: "0.2.0"
  # Pinned so a new bundletool release cannot change what "too large" means
  # between two runs. The digest is checked before the jar runs.
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
  # Play's per-device download ceiling is 200 MB. 190 leaves room for the
  # signing and compression overhead a real serve adds on top of what
  # bundletool measures here.
  MAX_ABI_DOWNLOAD_BYTES: 199229440
  # The SDK commit rust/Cargo.toml pins. Kept here only so the manifest job can
  # report it; the build itself reads rust/Cargo.toml.
  BUILDER_IMAGE: zingodevops/android_builder:018
  NODE_VERSION: 22.18.0
  CARGO_TERM_COLOR: always
  # SWARM ships three device ABIs. Upstream also ships 32-bit x86; no
  # current phone or emulator image needs it, and dropping it is a third of the
  # native build time.
  RN_ARCHS: armeabi-v7a,arm64-v8a,x86_64

jobs:
  js:
    name: JS lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Yarn install
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Lint
        run: yarn lint:check

      - name: Typecheck
        run: yarn typecheck

      - name: Jest
        run: yarn test --ci

      # Cheap, and it runs here rather than after the ~40 minutes it takes to
      # produce an APK, so a branding regression is caught in two minutes.
      - name: No upstream branding in the shipped text
        run: node scripts/check_no_upstream_branding.mjs --sources

      # A font the code names but does not ship renders as the system face
      # with no error at all, which is how iOS shipped three declared-but-
      # absent typefaces on a green build. This binds every link at once:
      # typography.ts, assets/fonts, react-native.config.js, the Gradle
      # staging task, and the iOS Info.plist, so the platforms cannot drift.
      - name: Fonts are shipped and registered
        run: node scripts/check_fonts_registered.mjs

      # Play refuses an over-length listing field at upload, which is after
      # the ~40 minutes of build. The limits cost two seconds here.
      - name: Play listing fits and carries no upstream wording
        run: node scripts/check_play_listing.mjs

      # The images are the other half of the same funnel: Play refuses an icon
      # that is not 512x512 32-bit PNG, a feature graphic that is not
      # 1024x500, a screenshot whose long side is more than twice its short
      # side, or a second screenshot that does not exist at all.
      - name: Play assets are the sizes Play accepts
        run: node scripts/store/check_store_art.mjs --store play

  rust:
    name: Rust ${{ matrix.abi }}
    runs-on: ubuntu-latest
    container:
      image: zingodevops/android_builder:018
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            cc: aarch64-linux-android
            std: 'true'
            # One ABI generates the Kotlin bindings; they are ABI-independent.
            bindings: 'true'
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            cc: armv7a-linux-androideabi
            std: 'false'
            bindings: 'false'
          - abi: x86_64
            target: x86_64-linux-android
            cc: x86_64-linux-android
            std: 'false'
            bindings: 'false'
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo
      TARGET: ${{ matrix.target }}
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARGO_NDK_PLATFORM: 26
      CARGO_NDK_ANDROID_PLATFORM: 26
      AR: llvm-ar
      LD: ld
      RANLIB: llvm-ranlib
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends --no-install-suggests \
            build-essential cmake golang clang-18 libclang-18-dev \
            protobuf-compiler gcc g++

      - uses: actions/checkout@v4

      # ONE cache for all three ABIs, and only the downloaded sources plus the
      # two helper binaries - never the target directory.
      #
      # This repository's Actions cache budget is 10 GB and the iOS pipeline
      # shares it. Caching `rust/target` per ABI cost about 2.2 GB each: three
      # of those filled the budget on their own and evicted the iOS agent's
      # cache. It bought roughly three minutes per ABI on a nine-minute build,
      # which is not worth taking the budget from another pipeline.
      #
      # The registry and the `bindgen`/`cargo-ndk` binaries are the same bytes
      # for every ABI, so one entry serves all three. The three jobs race to
      # save it; the losers log "cache already exists", which is harmless.
      - name: Cargo registry and tools cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cargo/bin
            ${{ github.workspace }}/.cargo/registry/index
            ${{ github.workspace }}/.cargo/registry/cache
            ${{ github.workspace }}/.cargo/git/db
          key: swarm-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: swarm-cargo-

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          # CARGO_HOME is redirected into the workspace so it can be cached,
          # which takes its bin directory off the image's PATH. Without this
          # the cached `bindgen` is invisible to `command -v`, and the install
          # below then fails on the binary it cannot see.
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Tools (bindgen-cli, cargo-ndk)
        run: |
          # $GITHUB_PATH only affects later steps, so export it here too.
          export PATH="$CARGO_HOME/bin:$PATH"
          # aws-lc-sys needs bindgen-cli on the PATH.
          command -v bindgen   >/dev/null 2>&1 || cargo install --locked --force bindgen-cli
          command -v cargo-ndk >/dev/null 2>&1 || cargo install --locked --force --version 4.0.1 cargo-ndk
          bindgen --version
          cargo ndk --version

      - name: Confirm the SWARM SDK pin
        run: |
          set -eu
          echo "--- rust/Cargo.toml SDK pins ---"
          grep -E '^(zingolib|pepper-sync|zingolib_testutils) *=' rust/Cargo.toml
          # This app must not build against the upstream SDK: that one has no
          # SwarmTestnet profile, and the resulting wallet would be on the
          # wrong chain while looking correct.
          if grep -qE '^(zingolib|pepper-sync|zingolib_testutils) *=.*zingolabs/zingolib' rust/Cargo.toml; then
            echo "ERROR: the SDK pin still points at zingolabs/zingolib" >&2
            exit 1
          fi
          grep -q 'github.com/Swarmcoin/privacy-zingolib' rust/Cargo.toml

      - name: Verify SWARM address compatibility
        working-directory: rust
        run: cargo test --locked -p zingo swarm_prefix_tests --lib

      # The chain hint for SWARM production is not its chain label, and the
      # genesis this app embeds has to be the one the network launched from.
      # Both are host-side facts, so they are asserted here rather than on a
      # device.
      - name: Verify the SWARM network identity and chain hints
        working-directory: rust
        run: cargo test --locked -p zingo swarm_identity_tests --lib

      - name: Build the wallet library
        working-directory: ./rust/lib
        env:
          CC: ${{ matrix.cc }}26-clang
          CARGO_FEATURE_STD: ${{ matrix.std }}
          CFLAGS_aarch64_linux_android: -mno-outline-atomics
          CXXFLAGS_aarch64_linux_android: -mno-outline-atomics
        run: cargo ndk --target "$TARGET" build --locked --release

      - name: Build the Nym proxy shim
        working-directory: ./rust/nym-proxy-ffi
        env:
          CC: ${{ matrix.cc }}26-clang
          CARGO_FEATURE_STD: ${{ matrix.std }}
        run: cargo ndk --target "$TARGET" build --locked --release --package zingo-nym-proxy-ffi

      # Library mode reads UniFFI metadata from the symbol table, so this must
      # run before the strip below.
      - name: Kotlin UniFFI bindings
        if: matrix.bindings == 'true'
        working-directory: ./rust
        run: |
          set -eu
          OUT="$GITHUB_WORKSPACE/android/app/build/generated/source/uniffi/release/java"
          mkdir -p "$OUT"
          cargo build --locked --release --package zingo-uniffi-bindgen
          ./target/release/zingo-wallet-uniffi-bindgen generate \
            lib/src/zingo.udl --language kotlin --no-format --out-dir "$OUT"
          cd nym-proxy-ffi
          "$GITHUB_WORKSPACE/rust/target/release/zingo-uniffi-bindgen" generate \
            --library "target/$TARGET/release/libzingo_nym_proxy_ffi.so" \
            --language kotlin --no-format --metadata-no-deps --out-dir "$OUT"
          find "$OUT" -name '*.kt' -print

      - name: Upload Kotlin UniFFI bindings
        if: matrix.bindings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swarm-kotlin-uniffi
          path: android/app/build/generated/source/uniffi/release/java/uniffi
          retention-days: 7

      - name: Strip and stage
        run: |
          set -eu
          llvm-strip --strip-all "rust/target/$TARGET/release/libzingo.so"
          llvm-objcopy --remove-section .comment "rust/target/$TARGET/release/libzingo.so"
          llvm-strip --strip-all "rust/nym-proxy-ffi/target/$TARGET/release/libzingo_nym_proxy_ffi.so"
          llvm-objcopy --remove-section .comment "rust/nym-proxy-ffi/target/$TARGET/release/libzingo_nym_proxy_ffi.so"
          mkdir -p native-out
          # UniFFI loads the wallet library under its uniffi name.
          cp "rust/target/$TARGET/release/libzingo.so" "native-out/libuniffi_zingo.so"
          cp "rust/nym-proxy-ffi/target/$TARGET/release/libzingo_nym_proxy_ffi.so" native-out/
          sha256sum native-out/*.so

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: swarm-native-${{ matrix.abi }}
          path: native-out/
          retention-days: 7

  apk:
    name: Debug-signed APK
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sdk-rev: ${{ steps.sdk.outputs.rev }}
      genesis: ${{ steps.sdk.outputs.genesis }}
      genesis-placeholder: ${{ steps.sdk.outputs.placeholder }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Yarn install
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Download native libraries (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: swarm-native-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Download native libraries (armeabi-v7a)
        uses: actions/download-artifact@v4
        with:
          name: swarm-native-armeabi-v7a
          path: android/app/src/main/jniLibs/armeabi-v7a

      - name: Download native libraries (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: swarm-native-x86_64
          path: android/app/src/main/jniLibs/x86_64

      - name: Download Kotlin UniFFI bindings
        uses: actions/download-artifact@v4
        with:
          name: swarm-kotlin-uniffi
          path: android/app/build/generated/source/uniffi/release/java/uniffi

      - name: Verify native and binding inputs
        run: |
          set -eu
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "android/app/src/main/jniLibs/$abi/libuniffi_zingo.so"
            test -f "android/app/src/main/jniLibs/$abi/libzingo_nym_proxy_ffi.so"
          done
          test -f android/app/build/generated/source/uniffi/release/java/uniffi/zingo/zingo.kt
          test -f android/app/build/generated/source/uniffi/release/java/uniffi/zingo_nym_proxy_ffi/zingo_nym_proxy_ffi.kt

      - name: Read the SWARM SDK identity
        id: sdk
        run: |
          set -eu
          REV="$(grep -m1 -oE 'privacy-zingolib", rev = "[0-9a-f]+' rust/Cargo.toml | grep -oE '[0-9a-f]{40}')"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          # The genesis hash is one constant in the SDK. Read it from the exact
          # revision this APK is built against, so the manifest cannot drift.
          curl -fsSL "https://raw.githubusercontent.com/Swarmcoin/privacy-zingolib/$REV/zingolib/src/config.rs" -o /tmp/config.rs
          GEN="$(grep -A4 'pub const SWARM_TESTNET_GENESIS:' /tmp/config.rs | grep -oE '"[0-9a-fA-F]{64}"' | head -1 | tr -d '"')"
          PLACEHOLDER_NAME="$(grep -A4 'pub const SWARM_TESTNET_GENESIS:' /tmp/config.rs | grep -c 'SWARM_TESTNET_GENESIS_PLACEHOLDER' || true)"
          if [ -z "${GEN:-}" ]; then
            GEN="$(grep -A4 'pub const SWARM_TESTNET_GENESIS_PLACEHOLDER:' /tmp/config.rs | grep -oE '"[0-9a-fA-F]{64}"' | head -1 | tr -d '"')"
          fi
          echo "genesis=$GEN" >> "$GITHUB_OUTPUT"
          if [ "$PLACEHOLDER_NAME" -gt 0 ]; then
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
          else
            echo "placeholder=false" >> "$GITHUB_OUTPUT"
          fi
          # SWARM production's genesis is not an SDK constant: ChainType
          # carries it and the SDK gives it no default, so the app embeds it.
          # Read it from the source this build comes from, and fail here
          # rather than write a manifest that guesses.
          MAIN_GEN="$(grep -A2 'pub const SWARM_MAINNET_GENESIS:' rust/lib/src/lib.rs | grep -oE '"[0-9a-f]{64}"' | head -1 | tr -d '"')"
          test -n "$MAIN_GEN" || { echo "ERROR: no SWARM_MAINNET_GENESIS in rust/lib/src/lib.rs" >&2; exit 1; }
          MAIN_SERVER="$(grep -m1 'pub const SWARM_MAINNET_SERVER_URI' rust/lib/src/lib.rs | grep -oE 'https://[^"]+')"
          test -n "$MAIN_SERVER" || { echo "ERROR: no SWARM_MAINNET_SERVER_URI in rust/lib/src/lib.rs" >&2; exit 1; }
          echo "mainnet_genesis=$MAIN_GEN" >> "$GITHUB_OUTPUT"
          echo "mainnet_server=$MAIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "SDK rev $REV testnet genesis $GEN placeholder=$PLACEHOLDER_NAME"
          echo "mainnet genesis $MAIN_GEN server $MAIN_SERVER"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # The release build type is what bundles the JS and runs R8. With no
      # release keystore configured, its signing config falls back to the
      # checked-in debug keystore, so the output is a debug-signed APK: exactly
      # what sideloading for a private test needs, and nothing that could be
      # mistaken for a published build.
      - name: Assemble the APK
        working-directory: android
        run: |
          ./gradlew assembleProdRelease \
            -PswarmVersionCode=${{ env.SWARM_ANDROID_VERSION_CODE }} \
            -PswarmVersionName=${{ env.SWARM_ANDROID_VERSION_NAME }} \
            -PreactNativeArchitectures=${{ env.RN_ARCHS }} --no-daemon --stacktrace

      # No AAB. The brief asked for an unsigned release bundle "if cheap", and
      # it is not: with no release keystore in this repository the bundle comes
      # out debug-signed, which no store will accept, and it roughly doubled
      # the download - the artifact was 482 MB of which the owner needed 200.

      # Everything asserted here is something this app claims about itself and
      # could get wrong silently. A missing font does not fail a build - it
      # just renders in the wrong typeface. A stray `zcash` scheme does not
      # fail a build - it just makes this app compete for payment links it
      # cannot honour. So the APK is opened and read.
      - name: Verify what the APK actually contains
        run: |
          set -eu
          APK="$(find android/app/build/outputs -name '*.apk' | head -1)"
          echo "inspecting $APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          unzip -Z1 "$APK" > /tmp/apk-list-names.txt
          echo "APK entries: $(wc -l < /tmp/apk-list-names.txt)"

          echo "--- the three design-system typefaces are bundled ---"
          for f in Sora-Regular Sora-SemiBold Sora-Bold \
                   Manrope-Regular Manrope-Medium Manrope-SemiBold \
                   JetBrainsMono-Regular JetBrainsMono-Medium; do
            grep -q "assets/fonts/$f.ttf" /tmp/apk-list.txt || {
              echo "ERROR: $f.ttf is not in the APK - fontFamily would fall back silently" >&2
              exit 1
            }
            echo "  ok assets/fonts/$f.ttf"
          done

          echo "--- the native wallet library is present for every ABI ---"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/$abi/libuniffi_zingo.so" /tmp/apk-list.txt || {
              echo "ERROR: libuniffi_zingo.so missing for $abi" >&2; exit 1; }
            echo "  ok lib/$abi/libuniffi_zingo.so"
          done

          echo "--- identity and scheme claims ---"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt 2>/dev/null || true
          if [ -s /tmp/badging.txt ]; then
            grep -q "package: name='green.swarm.wallet'" /tmp/badging.txt || {
              echo "ERROR: applicationId is not green.swarm.wallet" >&2
              head -3 /tmp/badging.txt >&2; exit 1; }
            echo "  ok applicationId green.swarm.wallet"
            # This app cannot pay a Zcash address, so it must not claim the
            # scheme and offer itself for links it would have to refuse.
            if grep -qi "scheme='zcash'" /tmp/badging.txt; then
              echo "ERROR: the APK still claims the zcash: URI scheme" >&2; exit 1; fi
            echo "  ok no zcash: scheme claimed"
          else
            echo "  note: aapt2 unavailable, skipped the manifest assertions"
          fi

          echo "--- the APK carries no wallet, seed or key material ---"
          # A wallet file or a test seed accidentally packaged into a build
          # people sideload would be a real disclosure, and it is the kind of
          # thing that arrives through a stray fixture rather than on purpose.
          if grep -qiE '(^|/)(wallet\.dat|wallet\.backup\.dat|wallet\.swap|.*\.jks|.*\.keystore|.*seed.*\.(txt|json|dat))$' /tmp/apk-list-names.txt; then
            echo "ERROR: the APK contains wallet or key material:" >&2
            grep -iE '(wallet\.|\.jks|\.keystore|seed)' /tmp/apk-list-names.txt >&2
            exit 1
          fi
          echo "  ok no wallet file, keystore or seed fixture is packaged"
          # The debug keystore signs the APK; it must not be INSIDE it.
          if grep -q 'debug.keystore' /tmp/apk-list-names.txt; then
            echo "ERROR: the debug keystore is packaged inside the APK" >&2; exit 1; fi
          echo "  ok the signing keystore is not packaged"

          echo "--- no upstream branding reaches a user ---"
          # Reads the bundled JS (Hermes bytecode, whose string table is still
          # plain ASCII) and the app label, because the sources are not what
          # ships. The desktop wallet reached its owner saying "Zingo PC is
          # locked"; this is the check that would have caught it.
          PATH="$(dirname "$AAPT"):$PATH" node scripts/check_no_upstream_branding.mjs "$APK"

          echo "--- the 64-bit libraries are 16 KB page aligned ---"
          # Android 15 maps 64-bit libraries on 16 KB pages. A 4 KB layout does
          # not load, and nothing before the device says so.
          python3 scripts/check_16kb_alignment.py "$APK"

          echo "--- the genesis is real, not the placeholder ---"
          test "${GENESIS_PLACEHOLDER}" = "false" || {
            echo "ERROR: this build still carries the placeholder genesis" >&2; exit 1; }
          echo "  ok genesis ${GENESIS}"
        env:
          GENESIS: ${{ steps.sdk.outputs.genesis }}
          GENESIS_PLACEHOLDER: ${{ steps.sdk.outputs.placeholder }}

      - name: Collect artifacts, checksums and the release manifest
        run: |
          set -eu
          mkdir -p dist
          find android/app/build/outputs -name '*.apk' -exec cp {} dist/ \;
          ls -l dist
          APK="$(ls dist/*.apk | head -1)"
          mv "$APK" "dist/swarm-wallet-${SWARM_VERSION}-android.apk"
          node -e '
            const fs = require("fs");
            const manifest = {
              app: "SWARM Wallet (Android)",
              version: process.env.SWARM_VERSION,
              // What the app itself prints, and what Android records. Kept
              // equal to the iOS build so the two platforms report one
              // version to the person testing them side by side.
              app_version_name: process.env.SWARM_ANDROID_VERSION_NAME,
              app_version_code: Number(process.env.SWARM_ANDROID_VERSION_CODE),
              network: {
                name: "SWARM Mainnet",
                light_wallet_chain_label: "swarm-mainnet",
                native_chain_hint: "swarm-mainnet:" + process.env.MAINNET_GENESIS,
                ticker: "SWM",
                default_server: process.env.MAINNET_SERVER,
                genesis: process.env.MAINNET_GENESIS,
                genesis_is_placeholder: false,
              },
              also_selectable: {
                name: "SWARM Testnet (engineering)",
                light_wallet_chain_label: "swarm-testnet",
                native_chain_hint: "swarm-testnet",
                ticker: "SWM",
                default_server: "https://lwd.swarm.green:443",
                genesis: process.env.GENESIS,
                genesis_is_placeholder: process.env.GENESIS_PLACEHOLDER === "true",
              },
              source: {
                app_repo: "https://github.com/Swarmcoin/swarm-mobile",
                app_sha: process.env.GITHUB_SHA,
                app_ref: process.env.GITHUB_REF,
                sdk_repo: "https://github.com/Swarmcoin/privacy-zingolib",
                sdk_sha: process.env.SDK_REV,
                upstream: "https://github.com/zingolabs/zingo-mobile (MIT)",
              },
              build: {
                workflow_run: process.env.GITHUB_RUN_ID,
                abis: ["arm64-v8a", "armeabi-v7a", "x86_64"],
                signing: "debug keystore (android/app/debug.keystore) - sideload only, not publishable",
                built_at: new Date().toISOString(),
              },
            };
            fs.writeFileSync("dist/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cat release-manifest.json
        env:
          SDK_REV: ${{ steps.sdk.outputs.rev }}
          GENESIS: ${{ steps.sdk.outputs.genesis }}
          GENESIS_PLACEHOLDER: ${{ steps.sdk.outputs.placeholder }}
          MAINNET_GENESIS: ${{ steps.sdk.outputs.mainnet_genesis }}
          MAINNET_SERVER: ${{ steps.sdk.outputs.mainnet_server }}

      - name: Upload the APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: swarm-wallet-android-${{ env.SWARM_VERSION }}
          path: dist/
          retention-days: 30

  bundle:
    name: Play bundle
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
    steps:
      # A job-level `if` cannot read `secrets`, so the gate is a step that
      # writes one output the rest of the job reads. Without the upload key
      # the job does nothing and finishes green: a branch with no secrets
      # must not show a red run.
      - name: Is the upload key configured
        id: gate
        run: echo "configured=${{ secrets.SWARM_UPLOAD_KEYSTORE_B64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Nothing to build
        if: steps.gate.outputs.configured != 'true'
        run: echo "no upload key configured - Play bundle skipped"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - name: Free disk space
        if: steps.gate.outputs.configured == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Yarn install
        if: steps.gate.outputs.configured == 'true'
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Download native libraries (arm64-v8a)
        if: steps.gate.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swarm-native-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Download native libraries (armeabi-v7a)
        if: steps.gate.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swarm-native-armeabi-v7a
          path: android/app/src/main/jniLibs/armeabi-v7a

      - name: Download native libraries (x86_64)
        if: steps.gate.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swarm-native-x86_64
          path: android/app/src/main/jniLibs/x86_64

      - name: Download Kotlin UniFFI bindings
        if: steps.gate.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swarm-kotlin-uniffi
          path: android/app/build/generated/source/uniffi/release/java/uniffi

      - name: Read the SWARM SDK identity
        id: sdk
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -eu
          REV="$(grep -m1 -oE 'privacy-zingolib", rev = "[0-9a-f]+' rust/Cargo.toml | grep -oE '[0-9a-f]{40}')"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          curl -fsSL "https://raw.githubusercontent.com/Swarmcoin/privacy-zingolib/$REV/zingolib/src/config.rs" -o /tmp/config.rs
          GEN="$(grep -A4 'pub const SWARM_TESTNET_GENESIS:' /tmp/config.rs | grep -oE '"[0-9a-fA-F]{64}"' | head -1 | tr -d '"')"
          PLACEHOLDER_NAME="$(grep -A4 'pub const SWARM_TESTNET_GENESIS:' /tmp/config.rs | grep -c 'SWARM_TESTNET_GENESIS_PLACEHOLDER' || true)"
          if [ -z "${GEN:-}" ]; then
            GEN="$(grep -A4 'pub const SWARM_TESTNET_GENESIS_PLACEHOLDER:' /tmp/config.rs | grep -oE '"[0-9a-fA-F]{64}"' | head -1 | tr -d '"')"
          fi
          echo "genesis=$GEN" >> "$GITHUB_OUTPUT"
          if [ "$PLACEHOLDER_NAME" -gt 0 ]; then
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
          else
            echo "placeholder=false" >> "$GITHUB_OUTPUT"
          fi
          # SWARM production's genesis is not an SDK constant: ChainType
          # carries it and the SDK gives it no default, so the app embeds it.
          # Read it from the source this build comes from, and fail here
          # rather than write a manifest that guesses.
          MAIN_GEN="$(grep -A2 'pub const SWARM_MAINNET_GENESIS:' rust/lib/src/lib.rs | grep -oE '"[0-9a-f]{64}"' | head -1 | tr -d '"')"
          test -n "$MAIN_GEN" || { echo "ERROR: no SWARM_MAINNET_GENESIS in rust/lib/src/lib.rs" >&2; exit 1; }
          MAIN_SERVER="$(grep -m1 'pub const SWARM_MAINNET_SERVER_URI' rust/lib/src/lib.rs | grep -oE 'https://[^"]+')"
          test -n "$MAIN_SERVER" || { echo "ERROR: no SWARM_MAINNET_SERVER_URI in rust/lib/src/lib.rs" >&2; exit 1; }
          echo "mainnet_genesis=$MAIN_GEN" >> "$GITHUB_OUTPUT"
          echo "mainnet_server=$MAIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "SDK rev $REV testnet genesis $GEN placeholder=$PLACEHOLDER_NAME"
          echo "mainnet genesis $MAIN_GEN server $MAIN_SERVER"

      # The keystore is decoded into the runner's temp directory, never into
      # the checkout, so no Gradle task, no packaging step and no artifact
      # upload can reach it. The delete step below runs whatever happens.
      - name: Decode the upload key
        if: steps.gate.outputs.configured == 'true'
        env:
          SWARM_UPLOAD_KEYSTORE_B64: ${{ secrets.SWARM_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -eu
          printf '%s' "$SWARM_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/swarm-upload.jks"
          test -s "$RUNNER_TEMP/swarm-upload.jks"
          echo "upload key decoded to \$RUNNER_TEMP/swarm-upload.jks"

      - name: Gradle setup
        if: steps.gate.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build the Play bundle and the release APK
        if: steps.gate.outputs.configured == 'true'
        working-directory: android
        env:
          SWARM_UPLOAD_KEYSTORE: ${{ runner.temp }}/swarm-upload.jks
          SWARM_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SWARM_UPLOAD_KEYSTORE_PASSWORD }}
          SWARM_UPLOAD_KEY_ALIAS: ${{ secrets.SWARM_UPLOAD_KEY_ALIAS }}
          SWARM_UPLOAD_KEY_PASSWORD: ${{ secrets.SWARM_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew bundleProdRelease assembleProdRelease \
            -PrequireReleaseSigning=true \
            -PswarmVersionCode=${{ env.SWARM_ANDROID_VERSION_CODE }} \
            -PswarmVersionName=${{ env.SWARM_ANDROID_VERSION_NAME }} \
            -PreactNativeArchitectures=${{ env.RN_ARCHS }} --no-daemon --stacktrace

      - name: Fetch bundletool
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -

      - name: Verify the bundle before anyone uploads it
        id: verify
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -eu
          AAB="$(find android/app/build/outputs/bundle -name '*.aab' | head -1)"
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          test -n "$AAB" || { echo "ERROR: no .aab was produced" >&2; exit 1; }
          test -n "$APK" || { echo "ERROR: no .apk was produced" >&2; exit 1; }
          echo "bundle $AAB"
          echo "apk    $APK"

          echo "--- the bundle carries a real certificate, not the debug one ---"
          jarsigner -verify -verbose -certs "$AAB" > /tmp/aab-verify.txt 2>&1 || true
          grep -q 'jar verified' /tmp/aab-verify.txt || {
            echo "ERROR: the AAB is not signed" >&2; tail -30 /tmp/aab-verify.txt >&2; exit 1; }
          if grep -q 'CN=Android Debug' /tmp/aab-verify.txt; then
            echo "ERROR: the AAB is debug-signed; Play refuses it" >&2; exit 1; fi
          keytool -printcert -jarfile "$AAB" > /tmp/aab-cert.txt
          AAB_OWNER="$(grep -m1 '^Owner:' /tmp/aab-cert.txt | sed 's/^Owner: //')"
          AAB_SHA="$(grep -m1 -E '^[[:space:]]+SHA256:' /tmp/aab-cert.txt | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "  ok AAB signed by $AAB_OWNER"
          echo "  ok AAB certificate sha256 $AAB_SHA"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk-certs.txt
          APK_DN="$(grep -m1 'certificate DN:' /tmp/apk-certs.txt | sed 's/.*certificate DN: //')"
          APK_SHA="$(grep -m1 'certificate SHA-256 digest:' /tmp/apk-certs.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f')"
          case "$APK_DN" in
            *"CN=Android Debug"*)
              echo "ERROR: the APK is debug-signed; this is meant to be the release build" >&2
              exit 1 ;;
          esac
          echo "  ok APK signed by $APK_DN"
          echo "  ok APK certificate sha256 $APK_SHA"
          test "$AAB_SHA" = "$APK_SHA" || {
            echo "ERROR: the AAB and the APK carry different certificates" >&2; exit 1; }
          echo "  ok both artifacts carry one certificate"
          echo "cert-sha256=$AAB_SHA" >> "$GITHUB_OUTPUT"

          echo "--- what each device would download ---"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" --output="$RUNNER_TEMP/play.apks" --mode=default --overwrite \
            --ks=android/app/debug.keystore --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey --key-pass=pass:android
          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total \
            --apks="$RUNNER_TEMP/play.apks" --dimensions=ABI > /tmp/sizes.csv
          cat /tmp/sizes.csv
          python3 - <<'PY'
          import csv, json, os, sys

          limit = int(os.environ["MAX_ABI_DOWNLOAD_BYTES"])
          rows = list(csv.DictReader(open("/tmp/sizes.csv")))
          sizes, over = {}, []
          for row in rows:
              abi = row.get("ABI") or row.get("abi")
              worst = int(row["MAX"])
              sizes[abi] = worst
              mark = "ok" if worst <= limit else "FAIL"
              print(f"  {mark} {abi} {worst} bytes ({worst / 1048576:.1f} MB)")
              if worst > limit:
                  over.append(abi)
          json.dump(sizes, open("/tmp/sizes.json", "w"))
          if over:
              print(f"ERROR: {', '.join(over)} exceed {limit} bytes", file=sys.stderr)
              sys.exit(1)
          PY

          echo "--- the 64-bit libraries are 16 KB page aligned ---"
          python3 scripts/check_16kb_alignment.py "$AAB" "$APK"

          echo "--- the release APK carries no wallet, seed or key material ---"
          unzip -Z1 "$APK" > /tmp/apk-names.txt
          unzip -Z1 "$AAB" > /tmp/aab-names.txt
          if grep -qiE '(^|/)(wallet\.dat|wallet\.backup\.dat|wallet\.swap|.*\.jks|.*\.keystore|.*seed.*\.(txt|json|dat))$' /tmp/apk-names.txt /tmp/aab-names.txt; then
            echo "ERROR: the artifacts contain wallet or key material:" >&2
            grep -iE '(wallet\.|\.jks|\.keystore|seed)' /tmp/apk-names.txt /tmp/aab-names.txt >&2
            exit 1
          fi
          echo "  ok no wallet file, keystore or seed fixture is packaged"
          if grep -qE 'swarm-upload\.jks|debug\.keystore' /tmp/apk-names.txt /tmp/aab-names.txt; then
            echo "ERROR: a signing keystore is packaged inside the artifacts" >&2; exit 1; fi
          echo "  ok the upload key is not inside the bundle or the APK"

          echo "--- no upstream branding reaches a user ---"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          PATH="$(dirname "$AAPT"):$PATH" node scripts/check_no_upstream_branding.mjs "$APK"

      - name: Collect the Play artifacts, checksums and the release manifest
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -eu
          mkdir -p dist-play
          cp "$(find android/app/build/outputs/bundle -name '*.aab' | head -1)" \
             "dist-play/swarm-wallet-${SWARM_VERSION}-play.aab"
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" \
             "dist-play/swarm-wallet-${SWARM_VERSION}-android-release.apk"
          node -e '
            const fs = require("fs");
            const manifest = {
              app: "SWARM Wallet (Android)",
              version: process.env.SWARM_VERSION,
              app_version_name: process.env.SWARM_ANDROID_VERSION_NAME,
              app_version_code: Number(process.env.SWARM_ANDROID_VERSION_CODE),
              network: {
                name: "SWARM Mainnet",
                light_wallet_chain_label: "swarm-mainnet",
                native_chain_hint: "swarm-mainnet:" + process.env.MAINNET_GENESIS,
                ticker: "SWM",
                default_server: process.env.MAINNET_SERVER,
                genesis: process.env.MAINNET_GENESIS,
                genesis_is_placeholder: false,
              },
              also_selectable: {
                name: "SWARM Testnet (engineering)",
                light_wallet_chain_label: "swarm-testnet",
                native_chain_hint: "swarm-testnet",
                ticker: "SWM",
                default_server: "https://lwd.swarm.green:443",
                genesis: process.env.GENESIS,
                genesis_is_placeholder: process.env.GENESIS_PLACEHOLDER === "true",
              },
              source: {
                app_repo: "https://github.com/Swarmcoin/swarm-mobile",
                app_sha: process.env.GITHUB_SHA,
                app_ref: process.env.GITHUB_REF,
                sdk_repo: "https://github.com/Swarmcoin/privacy-zingolib",
                sdk_sha: process.env.SDK_REV,
                upstream: "https://github.com/zingolabs/zingo-mobile (MIT)",
              },
              build: {
                workflow_run: process.env.GITHUB_RUN_ID,
                abis: ["arm64-v8a", "armeabi-v7a", "x86_64"],
                signing: "SWARM upload key, certificate sha256 " + process.env.CERT_SHA256,
                per_abi_download_bytes: JSON.parse(fs.readFileSync("/tmp/sizes.json", "utf8")),
                built_at: new Date().toISOString(),
              },
            };
            fs.writeFileSync("dist-play/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cd dist-play
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cat release-manifest.json
        env:
          SDK_REV: ${{ steps.sdk.outputs.rev }}
          GENESIS: ${{ steps.sdk.outputs.genesis }}
          GENESIS_PLACEHOLDER: ${{ steps.sdk.outputs.placeholder }}
          MAINNET_GENESIS: ${{ steps.sdk.outputs.mainnet_genesis }}
          MAINNET_SERVER: ${{ steps.sdk.outputs.mainnet_server }}
          CERT_SHA256: ${{ steps.verify.outputs.cert-sha256 }}

      - name: Upload the Play bundle
        if: steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swarm-wallet-play-${{ env.SWARM_VERSION }}
          path: dist-play/
          retention-days: 30

      - name: Delete the decoded upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/swarm-upload.jks"

  kotlin-unit:
    name: Kotlin JVM unit tests
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Yarn install
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Download Kotlin UniFFI bindings
        uses: actions/download-artifact@v4
        with:
          name: swarm-kotlin-uniffi
          path: android/app/build/generated/source/uniffi/release/java/uniffi

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # The nightly background sync turns the chain label settings.json
      # stores into the hint the library opens a wallet with. A bare
      # swarm-mainnet is refused by the library, so the mapping is tested on
      # the JVM here. The rest of the JVM suite is upstream's.
      - name: Background-sync chain hint
        working-directory: android
        run: ./gradlew :app:testProdReleaseUnitTest --tests 'org.ZingoLabs.Zingo.SwarmChainHintTest' --no-daemon --stacktrace

  smoke:
    name: Emulator smoke test
    needs: [apk, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-emulator-smoke }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: swarm-wallet-android-${{ env.SWARM_VERSION }}
          path: dist

      - name: Download the release-signed APK
        if: needs.bundle.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swarm-wallet-play-${{ env.SWARM_VERSION }}
          path: dist-play

      # The APK carries an x86_64 slice, so a stock x86_64 emulator image runs
      # it. Beyond installing, launching and rendering, the test drives the
      # first launch to a wallet and asserts the app already holds
      # https://lwd-main.swarm.green:443 with nothing configured by hand - the
      # defect the desktop wallet shipped as "NOT CONNECTED - No server
      # configured". Whether that server answers the runner is measured in the
      # script rather than assumed either way.
      - name: Install, launch and prove a fresh install connects
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          # The APK is ~200 MB: three uncompressed copies of a 60 MB Rust
          # library. The default userdata partition on some system images is
          # smaller than that, and the install fails with INSUFFICIENT_STORAGE
          # rather than anything that points at the real cause.
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # One line on purpose: the action runs each script line in its own
          # `sh -c`, so control flow lives in scripts/swarm_smoke_ci.sh.
          script: bash scripts/swarm_smoke_ci.sh

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke-evidence
          path: smoke-out/
          retention-days: 7
          if-no-files-found: ignore

      # The screens Play will show, photographed from the app this run built on
      # an emulator that can reach the wallet server. Best effort by design:
      # scripts/swarm_store_screens.sh never fails the job, and whatever it
      # reached is uploaded for a human to compose into the listing with
      # scripts/store/build_store_art.py.
      - name: Upload the store screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-store-screens
          path: store-out/
          retention-days: 30
          if-no-files-found: ignore
